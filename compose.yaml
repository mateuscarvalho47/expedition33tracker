name: expedition-33

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expedition33
      POSTGRES_USER: expedition33
      POSTGRES_PASSWORD: expedition33
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expedition33 -d expedition33"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["full"]
    build: .
    environment:
      DATABASE_URL: postgresql://expedition33:expedition33@postgres:5432/expedition33
      SESSION_SECRET: compose-development-secret-with-32-characters
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pnpm db:migrate:runtime && pnpm start"]

volumes:
  postgres-data:
