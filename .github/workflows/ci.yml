name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: expedition33
          POSTGRES_USER: expedition33
          POSTGRES_PASSWORD: expedition33
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expedition33 -d expedition33"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://expedition33:expedition33@127.0.0.1:5432/expedition33
      SESSION_SECRET: github-actions-session-secret-with-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm db:migrate:runtime

      - name: Static checks, unit tests and build
        run: pnpm check

      - name: Integration tests with isolated PostgreSQL
        run: pnpm test:integration

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build production image
        run: docker build -t expedition-33:${{ github.sha }} .
